services:
  edge:
    image: caddy:2-alpine
    container_name: potatoai_edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # TLS certificates live in /data. If this directory is ever empty on startup,
      # Caddy re-issues from Let's Encrypt and can hit their rate limit.
      - ${DATA_PATH:-../data}/caddy/data:/data
      - ${DATA_PATH:-../data}/caddy/config:/config
    networks:
      - potatoai_network
    depends_on:
      - frontend
      # cpanel.potatoaihub.com proxies here directly, bypassing `frontend`.
      - backend-nginx

  frontend:
    image: nginx:alpine
    container_name: potatoai_frontend
    restart: unless-stopped
    volumes:
      - ${FRONTEND_DIST_PATH:-../frontend-dist}:/usr/share/nginx/html:ro
      - ./nginx/frontend.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - potatoai_network

  # ── The four PHP services ───────────────────────────────────────────────────
  # They share one volume set. The host checkout at ${BACKEND_PATH} IS the code:
  # `git pull` on the server is live on the next request, no build and no recreate,
  # because php.production.ini sets opcache.validate_timestamps = 1.
  #
  # `build:` and the Dockerfile's `COPY backend/ ./` deliberately stay. The image is
  # still self-contained, the bind mount merely shadows it — which is what makes
  # reverting this change a one-line compose edit with no rebuild.

  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile.production
      args:
        PHP_VERSION: 8.4
    container_name: potatoai_app
    restart: unless-stopped
    working_dir: /var/www/backend
    env_file:
      - .env.production
    volumes:
      # Read-write, not :ro — filament:assets, storage:link and composer install write here.
      - ${BACKEND_PATH:-../backend}:/var/www/backend
      # These shadow the mount above (Docker resolves by path depth, deepest wins), so
      # storage and bootstrap/cache stay off the host checkout and out of git.
      - ${DATA_PATH:-../data}/backend/storage:/var/www/backend/storage
      - ${DATA_PATH:-../data}/backend/bootstrap-cache:/var/www/backend/bootstrap/cache
      # Mounted, not only baked into the image, so an ini tweak needs a recreate — never a rebuild.
      - ./php/php.production.ini:/usr/local/etc/php/conf.d/production.ini:ro
    networks:
      - potatoai_network
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-nginx:
    image: nginx:alpine
    container_name: potatoai_backend_nginx
    restart: unless-stopped
    volumes:
      # Same host tree `app` executes, so SCRIPT_FILENAME now resolves to the *same* file
      # in both containers. (It used to resolve to the image's separate baked-in copy.)
      - ${BACKEND_PATH:-../backend}/public:/var/www/backend/public:ro
      - ./nginx/backend.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - potatoai_network
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: potatoai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-potatoai_db}
      POSTGRES_USER: ${POSTGRES_USER:-potatoai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # PGDATA is the pgdata/ subdirectory, so an empty mount here makes Postgres
      # initialise a BRAND NEW EMPTY DATABASE. Never start this without the copy.
      - ${DATA_PATH:-../data}/postgres:/var/lib/postgresql/data
    networks:
      - potatoai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-potatoai} -d ${POSTGRES_DB:-potatoai_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: potatoai_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-potatoai_db}
    volumes:
      - ${DATA_PATH:-../data}/mongodb/db:/data/db
      - ${DATA_PATH:-../data}/mongodb/configdb:/data/configdb
    networks:
      - potatoai_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: potatoai_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ${DATA_PATH:-../data}/redis:/data
    networks:
      - potatoai_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  queue:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile.production
      args:
        PHP_VERSION: 8.4
    container_name: potatoai_queue
    restart: unless-stopped
    working_dir: /var/www/backend
    env_file:
      - .env.production
    volumes:
      # Must match `app`. Without the code mount this would silently run the stale
      # baked-in copy while app served the new one.
      - ${BACKEND_PATH:-../backend}:/var/www/backend
      - ${DATA_PATH:-../data}/backend/storage:/var/www/backend/storage
      - ${DATA_PATH:-../data}/backend/bootstrap-cache:/var/www/backend/bootstrap/cache
      - ./php/php.production.ini:/usr/local/etc/php/conf.d/production.ini:ro
    # A long-lived PHP process: it holds code in memory regardless of opcache, so a
    # deploy has to `php artisan queue:restart`. The worker then exits and
    # `restart: unless-stopped` brings it back on the new code.
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    networks:
      - potatoai_network
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile.production
      args:
        PHP_VERSION: 8.4
    container_name: potatoai_scheduler
    restart: unless-stopped
    working_dir: /var/www/backend
    env_file:
      - .env.production
    volumes:
      - ${BACKEND_PATH:-../backend}:/var/www/backend
      - ${DATA_PATH:-../data}/backend/storage:/var/www/backend/storage
      - ${DATA_PATH:-../data}/backend/bootstrap-cache:/var/www/backend/bootstrap/cache
      - ./php/php.production.ini:/usr/local/etc/php/conf.d/production.ini:ro
    # Unlike queue/websockets this needs no restart on deploy: every iteration spawns
    # a fresh `schedule:run` process, which picks up the mounted code by itself.
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    networks:
      - potatoai_network
    depends_on:
      app:
        condition: service_started

  websockets:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile.production
      args:
        PHP_VERSION: 8.4
    container_name: potatoai_websockets
    restart: unless-stopped
    working_dir: /var/www/backend
    env_file:
      - .env.production
    volumes:
      - ${BACKEND_PATH:-../backend}:/var/www/backend
      - ${DATA_PATH:-../data}/backend/storage:/var/www/backend/storage
      - ${DATA_PATH:-../data}/backend/bootstrap-cache:/var/www/backend/bootstrap/cache
      - ./php/php.production.ini:/usr/local/etc/php/conf.d/production.ini:ro
    # Reverb has no graceful reload, so a code change needs `up -d --force-recreate websockets`.
    command: php artisan reverb:start --host=0.0.0.0 --port=6001 --no-interaction
    networks:
      - potatoai_network
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy

networks:
  potatoai_network:
    driver: bridge

