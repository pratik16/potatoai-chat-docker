[PHP]
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_time = 300
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
; The code is a bind mount of the host checkout, so the realpath cache decides how long
; a *newly added* file stays invisible. The 120s default is too long to reason about.
realpath_cache_ttl = 10

[Date]
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Was 0. Production code is now a bind mount of ~/potatoaihub/backend, and with
; validation off PHP-FPM never re-stats a file — the mount would change nothing and
; every deploy would still need `up -d --force-recreate app`. With it on, an edit (or a
; `git pull`) is live on the next request, and `artisan route:cache` actually reaches FPM.
; One stat() per file per revalidate_freq seconds; set freq to 0 if you want it instant.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1

[session]
session.save_handler = redis
session.save_path = "tcp://redis:6379"
