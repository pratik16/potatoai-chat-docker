server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/backend/public;

    index index.php;
    client_max_body_size 64M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire (Filament's runtime) serves its JS bundle from the PHP route
    # /livewire/livewire.js and takes POSTs on /livewire/update — neither is a file
    # on disk. Without this, the static-asset regex below matches the .js and nginx
    # 404s it, which silently breaks the entire admin panel. A `^~` prefix location
    # outranks every regex location, so it wins before that regex is ever tried.
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_buffering off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Fall through to PHP when no such file exists: any Laravel route ending in an
    # asset extension would otherwise 404 here instead of reaching the app. The
    # expires/Cache-Control headers are inherited by nesting level, not across the
    # internal redirect into the \.php$ block, so a PHP response is not mislabelled
    # immutable.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        try_files $uri /index.php?$query_string;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
