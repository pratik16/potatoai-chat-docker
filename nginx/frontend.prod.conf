server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    index index.html;
    # Chat attachments: up to 5 × 10MB. Default nginx limit is 1m and causes 413.
    client_max_body_size 64M;

    location /api/ {
        # Re-resolve `backend-nginx` per request instead of once at config load.
        #
        # Without this, a backend deploy that recreates backend-nginx leaves this
        # container proxying to a dead IP *forever*: /api 502s for both the web SPA and
        # the React Native app (mobile/src/api/config.ts pins it to this same host), and
        # nothing looks broken -- `docker ps` is all healthy, backend-nginx's own access
        # log is clean because the requests never arrive, and cpanel keeps serving 200s
        # because Caddy resolves per connection. It took prod down on 2026-08-26.
        #
        # 127.0.0.11 is Docker's embedded DNS, which exists only on user-defined networks
        # (potatoai_network is one). ipv6=off avoids a failing AAAA lookup on every
        # resolve -- the bridge hands out v4 only.
        resolver 127.0.0.11 ipv6=off valid=10s;
        # The variable is what forces the runtime lookup. It also switches off nginx's
        # usual location-prefix rewriting, so $request_uri is required to keep passing the
        # full original path and query string -- which the bare
        # `proxy_pass http://backend-nginx:80;` did implicitly.
        set $api_upstream "http://backend-nginx:80";
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_buffering off;
        client_max_body_size 64M;
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
